pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        // Busca local.properties en el directorio android/ (donde está settings.gradle)
        def propertiesFile = new File(settings.rootDir, "local.properties")
        if (propertiesFile.exists()) {
            propertiesFile.withInputStream { properties.load(it) }
        }
        def sdkPath = properties.getProperty("flutter.sdk")
        assert sdkPath != null, "flutter.sdk not set in local.properties. Ensure this file exists in the android/ directory or root project, and contains an entry like flutter.sdk=path/to/your/flutter/sdk"
        return sdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.1.0" apply false
    id "org.jetbrains.kotlin.android" version "1.8.22" apply false
}

include ':app'

// No se necesita 'apply from:' aquí, el plugin lo maneja.
